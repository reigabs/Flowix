<div class="perfil-container">
  <div class="header-section">
    <h2>Meu perfil</h2>
    <p>Veja e gerencie suas informações pessoais</p>
  </div>

  <div class="profile-card">
    <!-- Seção de Foto -->
    <div class="avatar-section">
      <div class="avatar-circle">
        <span class="avatar-icon">👩‍💼</span>
      </div>
      <button class="btn-alterar-foto" (click)="alterarFoto()">Alterar foto</button>
    </div>

    <!-- Formulário de Informações Ligado ao TS -->
    <div class="profile-form">
      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" [(ngModel)]="perfil.nomeCompleto" [readonly]="!editando" placeholder="Não informado" />
      </div>

      <div class="form-group">
        <label>Nome da instituição</label>
        <input type="text" [(ngModel)]="perfil.nomeInstituicao" [readonly]="!editando" placeholder="Não informado" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Matrícula</label>
          <input type="text" [(ngModel)]="perfil.matricula" [readonly]="!editando" placeholder="Não informado" />
        </div>
        <div class="form-group">
          <label>Telefone</label>
          <input type="text" [(ngModel)]="perfil.telefone" [readonly]="!editando" placeholder="Não informado" />
        </div>
      </div>

      <div class="form-group">
        <label>E-mail ou CPF</label>
        <input type="text" [(ngModel)]="perfil.emailCpf" [readonly]="!editando" placeholder="Não informado" />
      </div>

      <!-- Botões de Ação Inferiores -->
      <div class="profile-actions">
        <button class="btn-excluir" (click)="excluirConta()">Excluir conta</button>
        <button class="btn-editar" (click)="alternarEdicao()">
          {{ editando ? 'Salvar alterações' : 'Editar informações' }}
        </button>
      </div>
    </div>
  </div>
</div>
