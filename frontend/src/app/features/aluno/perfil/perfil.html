
<div class="aluno-layout">

  <!-- MENU LATERAL -->
  <aside class="sidebar">

    <a class="logo" routerLink="/aluno/inicio">
      <img
        src="/imagens/flowix-logo.png"
        alt="Logo do FloWix"
        class="logo-imagem"
      >
      <span>Flowix</span>
    </a>

    <nav class="menu">

      <a
        routerLink="/aluno/inicio"
        routerLinkActive="ativo"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item"
      >
        <span class="menu-icone">⌂</span>
        Painel
      </a>

      <a
        routerLink="/aluno/nova-justificativa"
        routerLinkActive="ativo"
        class="menu-item"
      >
        <span class="menu-icone">▤</span>
        Nova justificativa
      </a>

      <a
        routerLink="/aluno/historico"
        routerLinkActive="ativo"
        class="menu-item"
      >
        <span class="menu-icone">▧</span>
        Meu histórico
      </a>

      <a
        routerLink="/aluno/notificacoes"
        routerLinkActive="ativo"
        class="menu-item"
      >
        <span class="menu-icone icone-sino">
          ♟
          <span class="contador">1</span>
        </span>
        Notificações
      </a>

      <a
        routerLink="/aluno/perfil"
        routerLinkActive="ativo"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-item"
      >
        <span class="menu-icone">●</span>
        Perfil
      </a>

    </nav>

    <button type="button" class="sair" (click)="sair()">
      <span>⇥</span>
      Sair da conta
    </button>

  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="conteudo">

    <header class="cabecalho">

      <a
        routerLink="/aluno/inicio"
        class="botao-voltar"
        aria-label="Voltar ao painel"
      >
        ←
      </a>

      <div class="titulo-pagina">
        <h1>Meu perfil</h1>
        <p>Veja e gerencie suas informações pessoais</p>
      </div>

    </header>

    <section class="perfil-conteudo">

      <!-- FOTO DO ALUNO -->
      <div class="area-foto">

        <img
          [src]="fotoPerfil"
          alt="Foto de perfil da aluna"
          class="foto-perfil"
        >

        <label for="fotoArquivo" class="botao-foto">
          Alterar foto
        </label>

        <input
          id="fotoArquivo"
          type="file"
          accept="image/*"
          class="input-foto"
          (change)="alterarFoto($event)"
        >

        <p class="ajuda-foto">Imagem de até 5 MB</p>

      </div>

      <!-- DADOS PESSOAIS -->
      <section class="dados-pessoais">

        <h2>Dados pessoais</h2>

        <form #formulario="ngForm" (ngSubmit)="salvarInformacoes()">

          <div class="campo campo-largo">
            <label for="nome">Nome completo</label>
            <input
              id="nome"
              name="nome"
              type="text"
              [(ngModel)]="dados.nome"
              [readonly]="!editando"
              required
            >
          </div>

          <div class="campo campo-largo">
            <label for="instituicao">Nome da instituição</label>
            <input
              id="instituicao"
              name="instituicao"
              type="text"
              [(ngModel)]="dados.instituicao"
              [readonly]="!editando"
              required
            >
          </div>

          <div class="linha-campos">

            <div class="campo">
              <label for="matricula">Matrícula</label>
              <input
                id="matricula"
                name="matricula"
                type="text"
                [(ngModel)]="dados.matricula"
                [readonly]="!editando"
                required
              >
            </div>

            <div class="campo">
              <label for="telefone">Telefone</label>
              <input
                id="telefone"
                name="telefone"
                type="tel"
                [(ngModel)]="dados.telefone"
                [readonly]="!editando"
                required
              >
            </div>

          </div>

          <div class="linha-campos linha-final">

            <div class="campo campo-email">
              <label for="emailCpf">E-mail ou CPF</label>
              <input
                id="emailCpf"
                name="emailCpf"
                type="text"
                [(ngModel)]="dados.emailCpf"
                [readonly]="!editando"
                required
              >
            </div>

            <div class="campo campo-turma">
              <label for="turma">Turma</label>
              <input
                id="turma"
                name="turma"
                type="text"
                [(ngModel)]="dados.turma"
                [readonly]="!editando"
                required
              >
            </div>

          </div>

          <p
            class="mensagem"
            *ngIf="mensagem"
            aria-live="polite"
          >
            {{ mensagem }}
          </p>

          <!-- BOTÕES -->
          <div class="acoes">

            <button
              type="button"
              class="botao-excluir"
              (click)="excluirConta()"
            >
              Excluir conta
            </button>

            <div class="acoes-edicao">

              <button
                *ngIf="editando"
                type="button"
                class="botao-cancelar"
                (click)="cancelarEdicao()"
              >
                Cancelar
              </button>

              <button
                type="button"
                class="botao-editar"
                (click)="alternarEdicao()"
              >
                {{ editando ? 'Salvar informações' : 'Editar informações' }}
              </button>

            </div>

          </div>

        </form>

      </section>

    </section>

  </main>

</div>
