<div class="conteudo">
  <main class="conteudo-principal">

    <section class="pagina-perfil">

      <!-- Cabeçalho -->
      <header class="cabecalho-pagina">
        <button
          class="botao-voltar"
          type="button"
          aria-label="Voltar ao painel"
          routerLink="/aluno"
        >
          <span>⬅</span>
        </button>

        <div class="titulo-area">
          <h1>Meu perfil</h1>
          <p>Veja e gerencie suas informações pessoais</p>
        </div>
      </header>

      <!-- Cartão Principal de Perfil -->
      <div class="perfil-card">

        <!-- Lado Esquerdo: Foto e Input de Arquivo Oculto -->
        <div class="perfil-foto-secao">
          <div class="avatar-container">
            <img 
              [src]="aluno.fotoUrl" 
              alt="Foto de perfil do aluno" 
              class="avatar-img"
            />
          </div>

          <!-- Input de arquivo invisível acionado pelo botão -->
          <input 
            #inputFoto 
            type="file" 
            accept="image/*" 
            style="display: none;" 
            (change)="onFotoSelecionada($event)"
          />

          <button type="button" class="botao-alterar-foto" (click)="inputFoto.click()">
            Alterar foto
          </button>
        </div>

        <!-- Lado Direito: Formulário de Dados Pessoais -->
        <div class="perfil-dados-secao">
          <h2>Dados pessoais</h2>

          <form class="form-grid">

            <div class="campo span-2">
              <label for="nome">Nome completo</label>
              <input 
                type="text" 
                id="nome" 
                [(ngModel)]="aluno.nome" 
                name="nome" 
                [disabled]="!editando"
              />
            </div>

            <div class="campo span-2">
              <label for="instituicao">Nome da instituição</label>
              <input 
                type="text" 
                id="instituicao" 
                [(ngModel)]="aluno.instituicao" 
                name="instituicao" 
                [disabled]="!editando"
              />
            </div>

            <div class="campo">
              <label for="matricula">Matrícula</label>
              <input 
                type="text" 
                id="matricula" 
                [(ngModel)]="aluno.matricula" 
                name="matricula" 
                [disabled]="!editando"
              />
            </div>

            <div class="campo">
              <label for="telefone">Telefone</label>
              <input 
                type="text" 
                id="telefone" 
                [(ngModel)]="aluno.telefone" 
                name="telefone" 
                [disabled]="!editando"
              />
            </div>

            <div class="campo">
              <label for="email">E-mail ou CPF</label>
              <input 
                type="text" 
                id="email" 
                [(ngModel)]="aluno.email" 
                name="email" 
                [disabled]="!editando"
              />
            </div>

            <div class="campo">
              <label for="turma">Turma</label>
              <input 
                type="text" 
                id="turma" 
                [(ngModel)]="aluno.turma" 
                name="turma" 
                [disabled]="!editando"
              />
            </div>

          </form>

          <!-- Rodapé do Card com Ações -->
          <div class="perfil-acoes">
            <button type="button" class="botao-excluir" (click)="excluirConta()">
              Excluir conta
            </button>

            <button type="button" class="botao-editar" (click)="alternarEdicao()">
              {{ editando ? 'Salvar informações' : 'Editar informações' }}
            </button>
          </div>

        </div>

      </div>

    </section>

  </main>
</div>
