<div class="conteudo">
  <main class="conteudo-principal">

    <section class="pagina-notificacoes">

      <!-- Cabeçalho -->
      <header class="cabecalho-pagina">
        <div class="titulo-area">
          <button
            class="botao-voltar"
            type="button"
            aria-label="Voltar ao painel"
            routerLink="/aluno"
          >
            <span>⬅</span>
          </button>
          <h1>Notificações</h1>
        </div>

        <button 
          type="button" 
          class="botao-marcar-lidas" 
          (click)="marcarTodasComoLidas()"
        >
          Marcar todas como lidas
        </button>
      </header>

      <!-- Abas de Filtro -->
      <nav class="abas-filtro" aria-label="Filtrar notificações">
        <button 
          type="button" 
          [class.ativo]="filtroAtual === 'Todos'" 
          (click)="filtrar('Todos')"
        >
          Todos
        </button>
        <button 
          type="button" 
          [class.ativo]="filtroAtual === 'Não lidas'" 
          (click)="filtrar('Não lidas')"
        >
          Não lidas
        </button>
        <button 
          type="button" 
          [class.ativo]="filtroAtual === 'Lidas'" 
          (click)="filtrar('Lidas')"
        >
          Lidas
        </button>
      </nav>

      <!-- Lista de Notificações -->
      <div class="lista-notificacoes">
        <div 
          class="linha-notificacao" 
          *ngFor="let item of notificacoesFiltradas"
          [class.nao-lida]="!item.lida"
          (click)="abrirNotificacao(item)"
        >
          <div class="notif-info-principal">
            <span class="icone-status" [ngClass]="item.tipo">
              {{ item.icone }}
            </span>
            <span class="mensagem">{{ item.mensagem }}</span>
          </div>

          <div class="notif-info-secundaria">
            <span class="tempo">{{ item.tempo }}</span>
            <button 
              type="button" 
              class="botao-seta" 
              title="Ver detalhes"
            >
              ❯
            </button>
          </div>
        </div>

        <div class="sem-registros" *ngIf="notificacoesFiltradas.length === 0">
          <p>Nenhuma notificação encontrada.</p>
        </div>
      </div>

    </section>

  </main>
</div>
