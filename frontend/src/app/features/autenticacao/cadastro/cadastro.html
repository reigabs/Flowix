<main class="cadastro">
  <div class="cadastro-container">

    <img
      src="images/logo-flowix.png"
      alt="Logo Flowix"
      class="logo"
    >

    <h1>Cadastro de perfil</h1>

    <p class="descricao">
      Selecione o tipo de perfil que deseja cadastrar
    </p>

    <div class="opcoes">

      <button class="opcao">
        <span class="icone">🎓</span>

        <div class="texto">
          <strong>Aluno</strong>
          <span>Acesse sua conta como aluno</span>
        </div>

        <span class="seta">›</span>
      </button>

      <button class="opcao">
        <span class="icone">🏫</span>

        <div class="texto">
          <strong>Secretaria</strong>
          <span>Gerencie as solicitações dos alunos</span>
        </div>

        <span class="seta">›</span>
      </button>

      <button class="opcao">
        <span class="icone">👨‍👩‍👦</span>

        <div class="texto">
          <strong>Responsável</strong>
          <span>Acompanhe as solicitações do aluno</span>
        </div>

        <span class="seta">›</span>
      </button>

    </div>

  </div>
</main>
